name: Save Traffic Stats

on:
  schedule:
    - cron: '0 6 * * 1'  # tous les lundis à 6h
  workflow_dispatch:      # permet de le lancer manuellement aussi

permissions:
  contents: write

jobs:
  save-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and append traffic stats
        run: |
          REPO="toocan-tracking/toocan-python"
          DATE=$(date +%Y-%m-%d)

          CLONES=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/traffic/clones")

          mkdir -p stats
          FILE="stats/traffic-history.json"
          [ -f "$FILE" ] || echo "[]" > "$FILE"

          jq --arg date "$DATE" --argjson data "$CLONES" \
            '. += [{"recorded_at": $date, "data": $data}]' "$FILE" > tmp.json
          mv tmp.json "$FILE"

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stats/traffic-history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update traffic stats"
          git push
